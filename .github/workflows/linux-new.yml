name: Linux build

on:
  workflow_dispatch:
    inputs:
      flavors:
        description: "flavors, comma splited, empty for 'min,lite,max-swow', available: min, lite, max[-eventengine, like swow/swoole/libev], custom"
        required: false
        default: ""
      archs:
        description: "archs, comma splited, empty for all, available: x86_64, aarch64"
        required: false
        default: ""
      sapis:
        description: "SAPIs, comma splited, empty for all, available: micro, micro-cli, cli"
        required: false
        default: ""
      libcs:
        description: "libcs, comma splited, empty for all, available: musl, glibc"
        required: false
        default: ""
      phpVers:
        description: "PHP versions, empty for all, available: 8.1, 8.2, 8.3, 8.4, 8.5, 8.6, 8.7"
        required: false
        default: ""
      zts:
        description: "zts, nts, or both, empty for zts"
        required: false
        type: string
        default: "zts"
      customExtensions:
        description: "custom extensions, used for custom flavor build"
        required: false
        default: ""
      customLibraries:
        description: "custom libraries, used for custom flavor build"
        required: false
        default: ""
      uploadRelease:
        description: "upload binaries to releases, otherwise only upload via artifact"
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      flavors:
        description: "flavors, comma splited, empty for 'min,lite,max-swow', available: min, lite, max[-eventengine, like swow/swoole/libev], custom"
        required: false
        type: string
        default: ""
      archs:
        description: "archs, comma splited, empty for all, available: x86_64, aarch64"
        required: false
        type: string
        default: ""
      sapis:
        description: "SAPIs, comma splited, empty for all, available: micro, micro-cli, cli"
        required: false
        type: string
        default: ""
      libcs:
        description: "libcs, comma splited, empty for all, available: musl, glibc"
        required: false
        type: string
        default: ""
      phpVers:
        description: "PHP versions, empty for all, available: 8.1, 8.2, 8.3, 8.4, 8.5, 8.6, 8.7"
        required: false
        type: string
        default: ""
      zts:
        description: "zts, nts, or both, empty for zts"
        required: false
        type: string
        default: "zts"
      customExtensions:
        description: "custom extensions, used for custom flavor build"
        required: false
        type: string
        default: ""
      customLibraries:
        description: "custom libraries, used for custom flavor build"
        required: false
        type: string
        default: ""
      uploadRelease:
        description: "upload binaries to releases, otherwise only upload via artifact"
        required: false
        type: boolean
        default: false
      workflowRepo:
        description: "repository of workflow to call"
        required: true
        type: string
      workflowRev:
        description: "revision of workflow to call"
        required: true
        type: string

jobs:
  gen-jobs:
    name: Generate jobs
    runs-on: ubuntu-latest
    outputs:
      jobs: ${{ steps.gen-jobs.outputs.jobs }}
    permissions:
      contents: write
    steps:
      - name: Generate jobs
        id: gen-jobs
        shell: php {0}
        run: |
          <?php

          set_error_handler(function ($severity, $message, $file, $line) {
              throw new ErrorException($message, 0, $severity, $file, $line);
          });

          if (${{ inputs.uploadRelease }}) {
              # create github release
              echo "create release\n";

              $tagName = date('Ymd') . '-linux-${{ github.run_id }}';

              $context = stream_context_create([
                  'http' => [
                      'method' => 'POST',
                      'header' => implode("\r\n", [
                          'Content-Type: application/json',
                          'Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}',
                          'User-Agent: file_get_contents/0',
                      ]),
                      'content' => json_encode([
                          'tag_name' => $tagName,
                          'name' => $tagName,
                          'body' => "automatic release\n\nworkflow run: [${{ github.run_id }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})",
                          #'draft' => true,
                          #'prerelease' => true,
                      ]),
                  ],
              ]);
              file_get_contents('https://api.github.com/repos/${{ github.repository }}/releases', context: $context);
          }

          function arg2arr(string $arg): array
          {
              return array_filter(array_map("trim", explode(',', $arg)));
          }

          $flavors = arg2arr(<<<'ARG'
          ${{ inputs.flavors }}
          ARG);
          $archs = arg2arr(<<<'ARG'
          ${{ inputs.archs }}
          ARG);
          $sapis = arg2arr(<<<'ARG'
          ${{ inputs.sapis }}
          ARG);
          $libcs = arg2arr(<<<'ARG'
          ${{ inputs.libcs }}
          ARG);
          $phpVers = arg2arr(<<<'ARG'
          ${{ inputs.phpVers }}
          ARG);
          $ztsArgs = arg2arr(<<<'ARG'
          ${{ inputs.zts }}
          ARG);
          $ztsModes = [];
          foreach ($ztsArgs ?: ['zts'] as $ztsArg) {
              switch (strtolower($ztsArg)) {
                  case 'zts':
                  case 'true':
                      $ztsModes['zts'] = true;
                      break;
                  case 'nts':
                  case 'false':
                      $ztsModes['nts'] = true;
                      break;
                  case 'both':
                      $ztsModes['zts'] = true;
                      $ztsModes['nts'] = true;
                      break;
                  default:
                      echo "invalid zts input: {$ztsArg}\n";
                      exit(1);
              }
          }
          $ztsList = [];
          if (isset($ztsModes['zts'])) {
              $ztsList[] = true;
          }
          if (isset($ztsModes['nts'])) {
              $ztsList[] = false;
          }

          if (!$flavors) {
              $flavors = ['min', 'lite', 'max-swow'];
          }
          if (!$archs) {
              $archs = ['x86_64', 'aarch64'];
          }
          if (!$sapis) {
              $sapis = ['micro', 'micro-cli', 'cli'];
          }
          if (!$libcs) {
              $libcs = ['musl', 'glibc'];
          }
          if (!$phpVers) {
              $phpVers = ['8.1', '8.2', '8.3', '8.4', '8.5', '8.6', '8.7'];
          }

          $customLibraries = <<<'ARG'
          ${{ inputs.customLibraries }}
          ARG;
          $customExtensions = <<<'ARG'
          ${{ inputs.customExtensions }}
          ARG;
          $customLibraries = trim($customLibraries);
          $customExtensions = trim($customExtensions);

          $jobs = [];

          foreach ($archs as $arch) {
              foreach ($libcs as $libc) {
                  # arm64 alpine containers cannot run js actions, so this leg
                  # runs on the runner host and wraps the musl steps in docker
                  $host = $arch === 'aarch64' && $libc === 'musl';
                  if ($host) {
                      echo "aarch64 musl: JavaScript Actions in Alpine containers are only supported on x64 Linux runners, run on the host instead\n";
                  }
                  foreach ($phpVers as $phpVer) {
                      foreach ($ztsList as $zts) {
                          $runner = match ($arch) {
                              'aarch64' => 'ubuntu-24.04-arm',
                              default => 'ubuntu-latest',
                          };
                          $imageTag = "linux-${libc}-${arch}";
                          $job = [
                              'flavors' => $flavors,
                              'customLibraries' => $customLibraries,
                              'customExtensions' => $customExtensions,
                              'imageTag' => $imageTag,
                              'containerImage' => $host ? '' : "ghcr.io/dixyes/prepared-lwmbs:{$imageTag}",
                              'host' => $host,
                              'arch' => $arch,
                              'runner' => $runner,
                              'sapis' => $sapis,
                              'libc' => $libc,
                              'phpVer' => $phpVer,
                              'zts' => $zts,
                              'volumes' => [],
                          ];
                          if ($libc === 'glibc') {
                            # the node bundled with the runner needs glibc 2.28, manylinux2014
                            # provides glibc 2.17, so share a volume to mount a compatible
                            # node over the bundled one
                            $job['volumes'] = [
                              '/node24:/node24:rw',
                              '/node24:/__e/node24:ro',
                            ];
                          }
                          $jobs[] = $job;
                      }
                  }
              }
          }

          if (!$jobs) {
              echo "no jobs generated\n";
              exit(1);
          }

          $json = json_encode($jobs);
          file_put_contents(getenv('GITHUB_OUTPUT'), "jobs=$json");
          # $jsonDebug = <<<'JSON'
          # [{
          #   "flavors": [
          #     "min",
          #     "lite",
          #     "max"
          #   ],
          #   "customLibraries": "",
          #   "customExtensions": "",
          #   "imageTag": "linux-glibc-x86_64-src",
          #   "arch": "x86_64",
          #   "sapis": [
          #     "micro",
          #     "micro-cli",
          #     "cli"
          #   ],
          #   "libc": "musl",
          #   "phpVer": "8.2"
          # }]
          # JSON;
          # $json = json_encode(json_decode($jsonDebug, true));
          # file_put_contents(getenv('GITHUB_OUTPUT'), "jobs=$json");


  build:
    name: ${{ matrix.phpVer }} ${{ matrix.libc }} ${{ matrix.arch }} ${{ matrix.zts && 'zts' || 'nts' }} ${{ toJson(matrix.flavors) }}
    runs-on: ${{ matrix.runner }}
    container:
      # an empty image runs the job on the runner host, see the aarch64 musl
      # note in gen-jobs: arm64 alpine containers cannot run javascript actions
      image: ${{ matrix.containerImage || '' }}
      volumes: ${{ matrix.volumes }}
    needs:
      - gen-jobs
    permissions:
      contents: write
    strategy:
      max-parallel: 12
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.gen-jobs.outputs.jobs) }}
    steps:

      # https://github.com/actions/runner/issues/2906
      - name: Setup node for manylinux2014
        if: matrix.libc == 'glibc'
        shell: bash
        run: |
          if [ -x /opt/node24/bin/node ]; then
            cp -a /opt/node24/. /node24/
          elif [ '${{ matrix.arch }}' = 'x86_64' ]; then
            # unofficial glibc 2.17 build, aarch64 has none, the image ships node 22
            node_ver=24.22.1
            node_sha=fb8ae2b650b593b2db2c6e01d69f3dd13661e21b333f8393d661be1e46ea5e82
            curl -fsSL --retry 3 -o /tmp/node24.tar.xz \
              "https://unofficial-builds.nodejs.org/download/release/v${node_ver}/node-v${node_ver}-linux-x64-glibc-217.tar.xz"
            echo "${node_sha}  /tmp/node24.tar.xz" | sha256sum -c -
            tar -xf /tmp/node24.tar.xz --strip-components=1 -C /node24
          else
            cp -a /opt/nodejs/. /node24/
          fi

      - name: Prepare host and build container
        if: matrix.host
        shell: bash
        run: |
          sudo mkdir -p /lwmbs /out /downloads /src
          sudo touch /versionFile
          sudo chown -R "$(id -u):$(id -g)" /lwmbs /out /downloads /src /versionFile
          # the generated build script uses absolute / paths, so bind mount the
          # same paths into a long lived container and drive it with docker exec
          sudo docker run -d --name lwmbs-build \
            --entrypoint sleep \
            -v /lwmbs:/lwmbs \
            -v /out:/out \
            -v /downloads:/downloads \
            -v /src:/src \
            -v /versionFile:/versionFile \
            "ghcr.io/dixyes/prepared-lwmbs:${{ matrix.imageTag }}" \
            infinity

      - name: Restore sources
        uses: actions/cache/restore@v4
        id: cache-restore
        with:
          path: |
            /downloads
            #/src
            /versionFile
          key: ${{ runner.os }}-build-v1-${{ matrix.phpVer }}-${{ hashFiles('/versionFile') }}
          restore-keys: |
            ${{ runner.os }}-build-v1-${{ matrix.phpVer }}-

      - name: Prepare lwmbs and sources
        id: prepare
        run: |
          export GITHUB_TOKEN="${{ secrets.GITHUB_TOKEN }}"

          if [ '${{ matrix.host }}' = 'true' ]
          then
            # keep a host side checkout: the lwmbs scripts and upload.js are
            # used on the host, and the container mounts this checkout
            if [ ! -d /lwmbs/.git ]
            then
              git clone --no-checkout "https://github.com/${{ inputs.workflowRepo || github.repository }}" /lwmbs
            fi
            cd /lwmbs
            git remote set-url origin "https://github.com/${{ inputs.workflowRepo || github.repository }}"
            git fetch origin ${{ inputs.workflowRev || github.sha }}
            git checkout FETCH_HEAD
            sudo docker exec -e GITHUB_TOKEN="$GITHUB_TOKEN" lwmbs-build sh -c 'cd / && php /lwmbs/fetch_source.php "" "" "--phpVer=${{ matrix.phpVer }}" "--versionFile=/versionFile"'
            sudo chown -R "$(id -u):$(id -g)" /downloads /versionFile
          else
            # prepare lwmbs
            cd /lwmbs
            git remote set-url origin "https://github.com/${{ inputs.workflowRepo || github.repository }}"
            git fetch origin ${{ inputs.workflowRev || github.sha }}
            git checkout FETCH_HEAD

            cd /
            php /lwmbs/fetch_source.php \
              "" \
              "" \
              "--phpVer=${{ matrix.phpVer }}" \
              "--versionFile=/versionFile"
          fi

          matched_key="${{ steps.cache-restore.outputs.cache-matched-key }}"
          src_hash="$(sha256sum /versionFile | head -c 64)"
          if [ "$matched_key" != "${matched_key##*${src_hash}}" ]
          then
            echo "srcHash=" >> "$GITHUB_OUTPUT"
          else
            echo "srcHash=${src_hash}" >> "$GITHUB_OUTPUT"
          fi

      - name: Save sources
        uses: actions/cache/save@v4
        if: steps.prepare.outputs.srcHash != ''
        with:
          path: |
            /downloads
            #/src
            /versionFile
          key: ${{ runner.os }}-build-v1-${{ matrix.phpVer }}-${{ steps.prepare.outputs.srcHash }}

      - name: Make build commands
        shell: php {0}
        run: |
          <?php

          $matrix = <<<'EOF'
          ${{ toJson(matrix) }}
          EOF;

          $matrix = json_decode($matrix, true);
          $customLibraries = $matrix['customLibraries'];
          $customExtensions = $matrix['customExtensions'];

          $commands = [];

          $output = fopen('/tmp/build.sh', 'w');

          $writesh = function (...$args) use ($output) {
              fwrite($output, sprintf(...$args));
              fwrite(STDOUT, sprintf(...$args));
          };

          $writesh(<<<BASH
          #!/bin/sh

          #set -x
          # do not stop at the first failure, collect the result and fail at the end
          set +e

          failed=0

          # NOTE: to build these binaries on your machine, just use dixyes/prepared-lwmbs:{$matrix['imageTag']} image

          # cached in github actions
          # echo "::group::Prepare source"
          # # prepare source for specified php version
          # # you may select only libraries and extensions you will use
          # php /lwmbs/fetch_source.php \
          #     "" \
          #     "" \
          #     --phpVer={$matrix['phpVer']} \
          #     --versionFile=/versionFile
          # ret="\$?"
          # echo "::endgroup::"

          # if [ ! "\$ret" = "0" ]
          # then
          #     echo "::error::fetch source failed"
          #     exit 1
          # fi

          echo "::group::Show versions"
          cat /versionFile
          sha256sum /versionFile
          echo "::endgroup::"

          BASH);

          $maxLibraries = [
            // compression
            'zlib','zstd','bzip2','xz','brotli','libzip',
            // curl and its deps
            'nghttp2','libssh2','curl',
            'libffi',
            'openssl',
            'onig',
            'libyaml',
            'libxml2',
            // gd deps
            'libpng', 'libjpegturbo', 'freetype', 'libwebp',
          ];
          $maxLibraries = implode(',', $maxLibraries);
          $maxExtensions = [
            'iconv',
            // xml things
            'dom','xml','simplexml','xmlwriter','xmlreader',
            'opcache',
            'bcmath',
            'phar','zip','zlib','bz2','zstd',
            'mysqlnd','mysqli','pdo','pdo_mysql',
            'mbstring','mbregex',
            'session',
            'ctype',
            'fileinfo',
            'filter',
            'tokenizer',
            'curl',
            'ffi',
            'redis',
            'sockets',
            'openssl',
            'yaml',
            'posix','pcntl',
            'sysvshm','sysvsem','sysvmsg',
            'gd',
          ];
          $maxExtensions = implode(',', $maxExtensions);

          foreach ($matrix['flavors'] as $flavor) {
              $libraries = match ($flavor) {
                  'min' => 'libffi',
                  'lite' => 'zstd,zlib,libffi,libzip,bzip2,xz,onig',
                  'max', 'max-swow' => $maxLibraries,
                  'max-libev' => "{$maxLibraries},libev",
                  'max-swoole' => "{$maxLibraries},libstdc++",
                  'custom' => $customLibraries,
              };
              $extensions = match ($flavor) {
                  'min' => 'posix,pcntl,ffi,filter,tokenizer,ctype',
                  'lite' => 'opcache,posix,pcntl,ffi,filter,tokenizer,ctype,iconv,mbstring,mbregex,sockets,zip,zstd,zlib,bz2,phar,fileinfo',
                  'max' => $maxExtensions,
                  'max-swow' => "{$maxExtensions},swow",
                  'max-swoole' => "{$maxExtensions},swoole",
                  'max-libev' => "{$maxExtensions},libev",
                  'custom' => $customExtensions,
              };

              $writesh("\n\n");
              $writesh(<<<BASH
              # ----- "$flavor" flavor -----

              echo "::group::Build $flavor libs"
              # rebuild libs for this flavor to avoid cache
              php /lwmbs/build_libs.php \
                  "$libraries" \
                  "--cc=\$LWMBS_CC" \
                  "--cxx=\$LWMBS_CXX" \
                  "--arch={$matrix['arch']}" \
                  "--fresh"
              ret="\$?"
              echo "::endgroup::"

              if [ ! "\$ret" = "0" ]
              then
                  echo "::error::failed build lib for $flavor"
                  failed=1
              else
              BASH);
              foreach ($matrix['sapis'] as $sapi) {
                  $command = match ($sapi) {
                      'micro' => 'build_micro.php',
                      'micro-cli' => 'build_micro.php --fakeCli',
                      'cli' => 'build_cli.php',
                  };
                  if (!$matrix['zts']) {
                      $command .= ' --no-zts';
                  }

                  $targetBin = match ($sapi) {
                      'micro' => '/src/php-src/sapi/micro/micro.sfx',
                      'micro-cli' => '/src/php-src/sapi/micro/micro.sfx',
                      'cli' => '/src/php-src/sapi/cli/php',
                  };
                  $binName = match ($sapi) {
                      'micro' => "micro.sfx",
                      'micro-cli' => "micro_cli.sfx",
                      'cli' => "php",
                  };

                  // $writesh("\n");
                  // $writesh("# cleam php build dir\n");

                  $writesh("\n\n");
                  $writesh(<<<BASH
                      echo "::group::Build $flavor shared $sapi"
                      # {$matrix['libc']}_shared $sapi
                      # rm php_micro.lo to avoid cache
                      rm -f /src/php-src/sapi/micro/php_micro.lo
                      php /lwmbs/$command \
                          "$libraries" \
                          "$extensions" \
                          "--cc=\$LWMBS_CC" \
                          "--cxx=\$LWMBS_CXX" \
                          "--arch={$matrix['arch']}"
                      ret="\$?"
                      echo "::endgroup::"
                      if [ ! "\$ret" = "0" ]
                      then
                          echo "::error::failed build $flavor shared $sapi"
                          failed=1
                      else
                          # copy the built bin out
                          mkdir -p /out/{$flavor}_shared
                          cp $targetBin /out/{$flavor}_shared/$binName
                          cp $targetBin.debug /out/{$flavor}_shared/$binName.debug
                      fi
                  BASH);
                  if ($matrix['libc'] == 'musl') {
                      $writesh("\n\n");
                      $writesh(<<<BASH
                          echo "::group::Build $flavor static $sapi"
                          # {$matrix['libc']}_static $sapi
                          # rm php_micro.lo to avoid cache
                          rm -f /src/php-src/sapi/micro/php_micro.lo
                          php /lwmbs/$command \
                              "$libraries" \
                              "$extensions" \
                              "--cc=\$LWMBS_CC" \
                              "--cxx=\$LWMBS_CXX" \
                              "--arch={$matrix['arch']}" \
                              "--allStatic"
                          ret="\$?"
                          echo "::endgroup::"
                          if [ ! "\$ret" = "0" ]
                          then
                              echo "::error::failed build $flavor static $sapi"
                              failed=1
                          else
                              # copy the built bin out
                              mkdir -p /out/{$flavor}_static
                              cp $targetBin /out/{$flavor}_static/$binName
                              cp $targetBin.debug /out/{$flavor}_static/$binName.debug
                          fi
                      BASH);
                  }
              }
              $writesh("\n\n");
              $writesh(<<<BASH
                  echo "::group::Dump $flavor licenses"
                  # dump licenses
                  php /lwmbs/dump_licenses.php \
                      "/out/{$flavor}_shared/licenses" \
                      "$libraries" \
                      "$extensions"
                  [ -d "/out/{$flavor}_static" ] && php /lwmbs/dump_licenses.php \
                      "/out/{$flavor}_static/licenses" \
                      "$libraries" \
                      "$extensions"
                  # copy versionFile
                  cp /versionFile "/out/{$flavor}_shared/versionFile"
                  [ -d "/out/{$flavor}_static" ] && cp /versionFile "/out/{$flavor}_static/versionFile"
                  echo "::endgroup::"

              fi
              BASH);
          }

          $writesh("\n");
          $writesh(<<<BASH
          if [ "\$failed" != "0" ]
          then
              echo "::error::build failed"
              exit 1
          fi
          BASH);

      - name: Build
        shell: sh {0}
        working-directory: /
        run: |
          set +e
          if [ '${{ matrix.host }}' = 'true' ]
          then
            # the host job has no job container, run the script inside ours
            sudo docker cp /tmp/build.sh lwmbs-build:/tmp/build.sh
            sudo docker exec -w / lwmbs-build sh /tmp/build.sh
            ret="$?"
            sudo chown -R "$(id -u):$(id -g)" /out
          else
            . /tmp/build.sh
            ret="$?"
          fi
          if [ "$ret" != "0" ]
          then
              echo "::error::build script failed with status $ret"
              exit 1
          fi
          # mkdir -p /out/min_shared
          # touch /out/min_shared/micro.sfx
          # php /lwmbs/dump_licenses.php \
          #   "/out/min_shared/licenses" \
          #   "libffi" \
          #   "ffi"
          # cp /versionFile "/out/min_shared/versionFile"

      # - name: Setup node
      #   if: always()
      #   uses: actions/setup-node@v3
      #   with:
      #     node-version: '16'

      - name: Prepare node for artifact upload
        if: always()
        shell: sh {0}
        run: |
          if [ '${{ matrix.host }}' = 'true' ]
          then
            # the runner host has node already, install the actions packages
            # locally instead of into a container
            mkdir -p /tmp/actions-npm
            npm install --prefix /tmp/actions-npm \
              @actions/core@1.11.1 \
              @actions/github@5.1.1 \
              @actions/artifact@2.3.0 \
              @actions/exec@1.1.1
            echo "NODE_PATH=/tmp/actions-npm/node_modules" >> "$GITHUB_ENV"
          else
            if [ '${{ matrix.libc }}' = 'musl' ]
            then
                apk add gcompat libstdc++
            fi
            npm i -g \
              @actions/core@1.11.1 \
              @actions/github@5.1.1 \
              @actions/artifact@2.3.0 \
              @actions/exec@1.1.1
            echo "NODE_PATH=$(npm root --quiet -g)" >> "$GITHUB_ENV"
          fi
          which node
          node --version

      - name: Expose GitHub Runtime
        if: always()
        uses: crazy-max/ghaction-github-runtime@v3

      - name: Upload artifacts
        if: always()
        shell: node {0}
        run: |
          const context = {
            matrix: ${{ toJson(matrix) }},
            github: ${{ toJson(github) }},
            inputs: ${{ toJson(inputs) }},
          }
          const fs = require('fs');
          const core = require('@actions/core');

          const binFile = {
            micro: 'micro.sfx',
            'micro-cli': 'micro_cli.sfx',
            cli: 'php',
          };
          // static binaries are built for musl only
          let flavors = context.matrix.flavors.map(flavor => [`${flavor}_shared`, `${flavor}_static`]).flat();
          if (context.matrix.libc !== 'musl') {
            flavors = flavors.filter(flavor => flavor.endsWith('_shared'));
          }
          const missing = [];
          for (const flavor of flavors) {
            for (const sapi of context.matrix.sapis) {
              const filePath = `/out/${flavor}/${binFile[sapi]}`;
              if (!fs.existsSync(filePath)) {
                missing.push(filePath);
              }
            }
          }

          if (missing.length) {
            core.setFailed(`missing expected artifacts:\n${missing.join('\n')}`);
          } else {
            const { main } = require('/lwmbs/.github/workflows/upload.js')
            main('${{ secrets.GITHUB_TOKEN }}', 'linux', context).catch(err => core.setFailed(err instanceof Error ? err.message : String(err)))
          }

      - name: Clean up build container
        if: always() && matrix.host
        shell: bash
        run: sudo docker rm -f lwmbs-build || true

